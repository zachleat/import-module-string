on:
  push:
    branches-ignore:
      - "gh-pages"
jobs:
  testnode:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["22", "24", "26"]
    name: Vitest Node ${{ matrix.node }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Do *not* use cache (see: tanstack cache poisoning vuln)
          # cache: npm
      - run: npm ci
      - run: npm run test:node
  testbrowser:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        node: ["22"]
    name: Vitest Browser Mode ${{ matrix.node }} on ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
      - name: Setup node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # 7.1.0
        with:
          node-version: ${{ matrix.node }}
          # Do *not* use cache (see: tanstack cache poisoning vuln)
          # cache: npm
      - run: npm ci
      - run: npx playwright install
      - run: npm run test:browser
env:
  YARN_GPG: no
